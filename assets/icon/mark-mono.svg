<!-- Single-colour outline of the mark for Android's themed (monochrome)
     icon. Only the alpha channel matters; the launcher tints it. The mask
     hides the back slip wherever the front slip covers it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <mask id="behind-front">
      <rect width="512" height="512" fill="#ffffff"/>
      <rect x="85" y="225" width="282" height="212" fill="#000000"/>
    </mask>
  </defs>
  <g transform="translate(-4 -12)" fill="none" stroke="#ffffff">
    <g mask="url(#behind-front)">
      <rect x="150" y="96" width="260" height="190" stroke-width="22"/>
      <path d="M182 150H330M182 190H290" stroke-width="18"/>
    </g>
    <rect x="96" y="236" width="260" height="190" stroke-width="22"/>
    <path d="M128 290H276M128 330H236" stroke-width="18"/>
    <path d="M300 370L360 210" stroke-width="22"/>
    <circle cx="300" cy="370" r="26" fill="#ffffff" stroke="none"/>
    <circle cx="360" cy="210" r="26" fill="#ffffff" stroke="none"/>
  </g>
</svg>
