<!-- Simplekasten mark: two slips from the slip-box, joined by a link.
     512x512, transparent. build-icons.mjs puts it on the purple tile. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g transform="translate(-4 -12)">
    <!-- back slip -->
    <rect x="164" y="110" width="260" height="190" fill="#0cb2c0"/>
    <rect x="150" y="96" width="260" height="190" fill="#e8e6d9" stroke="#1d0a2b" stroke-width="14"/>
    <path d="M182 150H330M182 190H290" stroke="#1d0a2b" stroke-width="12"/>
    <!-- front slip -->
    <rect x="110" y="250" width="260" height="190" fill="#0cb2c0"/>
    <rect x="96" y="236" width="260" height="190" fill="#fad141" stroke="#1d0a2b" stroke-width="14"/>
    <path d="M128 290H276M128 330H236" stroke="#1d0a2b" stroke-width="12"/>
    <!-- the link between them -->
    <path d="M300 370L360 210" stroke="#f725a0" stroke-width="18"/>
    <circle cx="300" cy="370" r="24" fill="#f725a0" stroke="#1d0a2b" stroke-width="10"/>
    <circle cx="360" cy="210" r="24" fill="#f725a0" stroke="#1d0a2b" stroke-width="10"/>
  </g>
</svg>
